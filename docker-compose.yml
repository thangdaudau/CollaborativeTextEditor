services:
  # 1. Postgres do chính Supabase dựng (Có sẵn full role supabase_admin, anon, authenticated...)
  db:
    image: supabase/postgres:15.6.1.143
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: collaborative_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # <-- ĐÃ THÊM: Mount volume để lưu data cố định
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 15s

  # 2. Supabase Postgres Meta
  postgres-meta:
    image: supabase/postgres-meta:v0.97.0
    container_name: local_postgres_meta
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: collaborative_db
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgrespassword

  # 3. Supabase Studio UI
  studio:
    image: supabase/studio:2026.08.10-sha-5b68af1
    container_name: local_supabase_studio
    restart: always
    depends_on:
      - postgres-meta
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://postgres-meta:8080
      POSTGRES_PASSWORD: postgrespassword
      DEFAULT_ORGANIZATION: "Local Org"
      DEFAULT_PROJECT: "Collaborative Text Editor"
      SUPABASE_URL: http://localhost:54323

  redis:
    image: redis:8.8.1-alpine
    container_name: local_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: